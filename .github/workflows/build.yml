name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "VERSION=1.${{ github.run_number }}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "dotify-widget-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dotify-widget-v${{ env.VERSION }}
          path: dotify-widget-v*.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Dotify Widget v${{ env.VERSION }}
          body: Версия ${{ env.VERSION }} из ${{ github.sha }}. Скачай dotify-widget-v${{ env.VERSION }}.apk и установи поверх старой.
          prerelease: false
          make_latest: true
          files: dotify-widget-v${{ env.VERSION }}.apk
